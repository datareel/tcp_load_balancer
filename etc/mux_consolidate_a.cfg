# DRLB 2.2 port multiplexer example: one cloud server in place of two or more, server A
#
# Before: app1 and app2 each ran on a cloud server of its own, each with
# its own public address and firewall rules. After: one cloud server (B)
# runs both applications and the shared metrics collector, and server A
# (on site) reaches all of them over one TLS tunnel. Local clients and
# programs on A connect to the ports below on 127.0.0.1 as if each
# application were local.
#
# Change the names, addresses and certificate files, then check it with
#   drlb_server --config-file=FILE --check-config
# and run it as drlb_server@NAME. The peer's config is mux_consolidate_b.cfg.
# See "Port multiplexer" in the user guide.

[LBSERVER]
service_name = consolidate_a
mode = MUX
mux_peer_name = drlb-a.example.com
enable_logging = 1
log_level = 1
logfile_name = /var/log/drlb/consolidate_a.log
enable_stats = 1
stats_file_name = /var/log/drlb/consolidate_a_stats.log
use_timeout = 1
timeout_secs = 3600

[MUXTUNNEL]
name = drlb-b
remote_host = drlb-b.example.com
remote_port = 9443
tunnel_connections = 1

# app1 API, was on the app1 cloud server
[MUXPORT]
channel = app1_api
protocol = TCP
listen_ip_addr = 127.0.0.1
port = 8081

# app2 API, was on the app2 cloud server
[MUXPORT]
channel = app2_api
protocol = TCP
listen_ip_addr = 127.0.0.1
port = 8082

# Metrics datagrams (statsd style) from both applications' agents
[MUXPORT]
channel = metrics
protocol = UDP
listen_ip_addr = 127.0.0.1
port = 8125

# This server's certificate is its client certificate on the tunnel; the
# peer's certificate is checked against the CA and remote_host.
[SSLCONFIG]
ssl_key_file = /etc/drlb/ssl/private/drlb-a.key
ssl_cert_file = /etc/drlb/ssl/certs/drlb-a.crt
ssl_backend_ca_list_file = /etc/drlb/ssl/certs/tunnel_ca.crt
