# DRLB 2.2 port multiplexer example: one cloud server in place of two or more, server B
#
# The one cloud server: it accepts the tunnel from A on 9443 and delivers
# each channel to the application that now runs here. The applications
# listen on 127.0.0.1 only, so the only open port is 9443, for server A.
# app2 runs on two nodes here, load balanced.
#
# Change the names, addresses and certificate files, then check it with
#   drlb_server --config-file=FILE --check-config
# and run it as drlb_server@NAME. The peer's config is mux_consolidate_a.cfg.
# See "Port multiplexer" in the user guide.

[LBSERVER]
service_name = consolidate_b
mode = MUX
mux_peer_name = drlb-b.example.com
mux_listen = 1
port = 9443
mux_allowed_peers = drlb-a.example.com
enable_logging = 1
log_level = 1
logfile_name = /var/log/drlb/consolidate_b.log
enable_stats = 1
stats_file_name = /var/log/drlb/consolidate_b_stats.log
use_timeout = 1
timeout_secs = 3600

[MUXDEST]
channel = app1_api
protocol = TCP
hostname = 127.0.0.1
port = 8081

# app2 load balanced over two instances
[MUXDEST]
channel = app2_api
protocol = TCP
nodes = app2_n1, app2_n2
scheme = LB_RR

[MUXDEST]
channel = metrics
protocol = UDP
hostname = 127.0.0.1
port = 8125

[LBNODE]
node_name = app2_n1
hostname = 127.0.0.1
port_number = 9081

[LBNODE]
node_name = app2_n2
hostname = 127.0.0.1
port_number = 9082

# Peers must present a certificate signed by ssl_client_ca_list_file
[SSLCONFIG]
ssl_key_file = /etc/drlb/ssl/private/drlb-b.key
ssl_cert_file = /etc/drlb/ssl/certs/drlb-b.crt
ssl_client_ca_list_file = /etc/drlb/ssl/certs/tunnel_ca.crt
ssl_backend_ca_list_file = /etc/drlb/ssl/certs/tunnel_ca.crt
