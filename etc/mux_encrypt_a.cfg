# DRLB 2.2 port multiplexer example: encryption for services that have none, server A
#
# Redis, memcached, syslog and an in house application speak plain TCP
# or UDP. Carried over the tunnel they are protected by TLS 1.3 (with
# post-quantum key exchange on OpenSSL 3.5) and certificates checked on
# both ends, without changing the services or their clients. The
# clients on A connect to 127.0.0.1; nothing plain crosses the network.
#
# Change the names, addresses and certificate files, then check it with
#   drlb_server --config-file=FILE --check-config
# and run it as drlb_server@NAME. The peer's config is mux_encrypt_b.cfg.
# See "Port multiplexer" in the user guide.

[LBSERVER]
service_name = encrypt_a
mode = MUX
mux_peer_name = drlb-a.example.com
enable_logging = 1
log_level = 1
logfile_name = /var/log/drlb/encrypt_a.log
enable_stats = 1
stats_file_name = /var/log/drlb/encrypt_a_stats.log
use_timeout = 1
timeout_secs = 3600

[MUXTUNNEL]
name = drlb-b
remote_host = drlb-b.example.com
remote_port = 9443
tunnel_connections = 1

[MUXPORT]
channel = redis
protocol = TCP
listen_ip_addr = 127.0.0.1
port = 6379

[MUXPORT]
channel = memcached
protocol = TCP
listen_ip_addr = 127.0.0.1
port = 11211

[MUXPORT]
channel = syslog
protocol = UDP
listen_ip_addr = 127.0.0.1
port = 514

# An in house application with no TLS of its own
[MUXPORT]
channel = inhouse_app
protocol = TCP
listen_ip_addr = 127.0.0.1
port = 7000

# B's report service sends results back to A over the same tunnel
[MUXDEST]
channel = reports
protocol = TCP
hostname = 127.0.0.1
port = 8090

# This server's certificate is its client certificate on the tunnel; the
# peer's certificate is checked against the CA and remote_host.
[SSLCONFIG]
ssl_key_file = /etc/drlb/ssl/private/drlb-a.key
ssl_cert_file = /etc/drlb/ssl/certs/drlb-a.crt
ssl_backend_ca_list_file = /etc/drlb/ssl/certs/tunnel_ca.crt
