# DRLB 2.2 port multiplexer example: encryption for services that have none, server B
#
# Server B delivers the plain services on 127.0.0.1, so they are never
# reachable from the network without the tunnel. Keep the services
# listening on 127.0.0.1 only, and do not set mux_allow_plain.
#
# Change the names, addresses and certificate files, then check it with
#   drlb_server --config-file=FILE --check-config
# and run it as drlb_server@NAME. The peer's config is mux_encrypt_a.cfg.
# See "Port multiplexer" in the user guide.

[LBSERVER]
service_name = encrypt_b
mode = MUX
mux_peer_name = drlb-b.example.com
mux_listen = 1
port = 9443
mux_allowed_peers = drlb-a.example.com
enable_logging = 1
log_level = 1
logfile_name = /var/log/drlb/encrypt_b.log
enable_stats = 1
stats_file_name = /var/log/drlb/encrypt_b_stats.log
use_timeout = 1
timeout_secs = 3600

[MUXDEST]
channel = redis
protocol = TCP
hostname = 127.0.0.1
port = 6379

[MUXDEST]
channel = memcached
protocol = TCP
hostname = 127.0.0.1
port = 11211

[MUXDEST]
channel = syslog
protocol = UDP
hostname = 127.0.0.1
port = 514

[MUXDEST]
channel = inhouse_app
protocol = TCP
hostname = 127.0.0.1
port = 7000

# Carried to A, which delivers it to its local report receiver
[MUXPORT]
channel = reports
protocol = TCP
listen_ip_addr = 127.0.0.1
port = 8090

# Peers must present a certificate signed by ssl_client_ca_list_file
[SSLCONFIG]
ssl_key_file = /etc/drlb/ssl/private/drlb-b.key
ssl_cert_file = /etc/drlb/ssl/certs/drlb-b.crt
ssl_client_ca_list_file = /etc/drlb/ssl/certs/tunnel_ca.crt
ssl_backend_ca_list_file = /etc/drlb/ssl/certs/tunnel_ca.crt
