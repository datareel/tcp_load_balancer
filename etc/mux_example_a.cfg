# DRLB 2.2 port multiplexer example, server A
#
# Server A carries its local PostgreSQL, Redis and syslog ports to
# server B over one TLS tunnel (B's port 9443), and delivers B's "web"
# channel to a local web server. Copy to /etc/drlb/app_mux.cfg, change
# the names, addresses and certificate files, then check it:
#   drlb_server --config-file=/etc/drlb/app_mux.cfg --check-config
# and run it as drlb_server@app_mux. See mux_example_b.cfg for server B
# and "Port multiplexer" in the user guide.

[LBSERVER]
service_name = app_mux
mode = MUX
# Name this server gives its peers. It must be in this server's
# certificate when the peer sets mux_allowed_peers. Default: host name.
mux_peer_name = drlb-a.example.com
enable_logging = 1
log_level = 1
logfile_name = /var/log/drlb/app_mux.log
enable_stats = 1
stats_file_name = /var/log/drlb/app_mux_stats.log
# Idle TCP streams are closed after timeout_secs, as connections are in
# the load balancer. Set use_timeout = 0 for long idle database pools.
use_timeout = 1
timeout_secs = 3600

# The peer to connect to. Add more [MUXTUNNEL] sections for more peers:
# streams are spread over every tunnel whose peer delivers the channel.
[MUXTUNNEL]
name = drlb-b
remote_host = drlb-b.example.com
remote_port = 9443
tunnel_connections = 1

# Local ports carried to the peer. The peer delivers each channel with a
# [MUXDEST] of the same name.
[MUXPORT]
channel = postgres
protocol = TCP
listen_ip_addr = 127.0.0.1
port = 5432

[MUXPORT]
channel = redis
protocol = TCP
listen_ip_addr = 127.0.0.1
port = 6379

[MUXPORT]
channel = syslog
protocol = UDP
listen_ip_addr = 127.0.0.1
port = 514

# A channel that comes from the peer (B's port 8080) is delivered here
[MUXDEST]
channel = web
protocol = TCP
hostname = 127.0.0.1
port = 80

# This server's certificate is its client certificate on the tunnel. The
# peer's certificate is checked against ssl_backend_ca_list_file and the
# [MUXTUNNEL] remote_host (or ssl_hostname).
[SSLCONFIG]
ssl_key_file = /etc/drlb/ssl/private/drlb-a.key
ssl_cert_file = /etc/drlb/ssl/certs/drlb-a.crt
ssl_backend_ca_list_file = /etc/drlb/ssl/certs/tunnel_ca.crt
