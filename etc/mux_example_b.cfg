# DRLB 2.2 port multiplexer example, server B
#
# Server B accepts the tunnel from server A on port 9443, delivers A's
# channels to its services (postgres load balanced over two nodes), and
# carries its own port 8080 back to A's web server. Copy to
# /etc/drlb/app_demux.cfg, change the names, addresses and certificate
# files, check it with --check-config and run it as
# drlb_server@app_demux. Open port 9443/tcp in firewalld for server A
# only. See mux_example_a.cfg for server A.

[LBSERVER]
service_name = app_demux
mode = MUX
mux_peer_name = drlb-b.example.com
# Accept tunnels on port and listen_ip_addr
mux_listen = 1
port = 9443
# Only these peers, each named in its own certificate
mux_allowed_peers = drlb-a.example.com
enable_logging = 1
log_level = 1
logfile_name = /var/log/drlb/app_demux.log
enable_stats = 1
stats_file_name = /var/log/drlb/app_demux_stats.log
use_timeout = 1
timeout_secs = 3600

# Channels from the peer and where they go
[MUXDEST]
channel = postgres
protocol = TCP
nodes = pg1, pg2
scheme = LB_RR

[MUXDEST]
channel = redis
protocol = TCP
hostname = 127.0.0.1
port = 6379

[MUXDEST]
channel = syslog
protocol = UDP
hostname = 127.0.0.1
port = 514

# Carried back to the peer, which delivers it to its web server
[MUXPORT]
channel = web
protocol = TCP
listen_ip_addr = 127.0.0.1
port = 8080

[LBNODE]
node_name = pg1
hostname = pg1.example.com
port_number = 5432

[LBNODE]
node_name = pg2
hostname = pg2.example.com
port_number = 5432

# Peers must present a certificate signed by ssl_client_ca_list_file
[SSLCONFIG]
ssl_key_file = /etc/drlb/ssl/private/drlb-b.key
ssl_cert_file = /etc/drlb/ssl/certs/drlb-b.crt
ssl_client_ca_list_file = /etc/drlb/ssl/certs/tunnel_ca.crt
ssl_backend_ca_list_file = /etc/drlb/ssl/certs/tunnel_ca.crt
