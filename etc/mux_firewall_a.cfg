# DRLB 2.2 port multiplexer example: one open port in place of many firewall rules, server A
#
# Server A (on site) carries six services to server B (cloud) over one
# tunnel on port 443, the one port most networks already allow out.
# Without the tunnel each service needs its own firewall and cloud
# security group rule; with it, A needs outbound 443/tcp only and B
# needs inbound 443/tcp from A only. A new service is a new channel
# here and on B, not a new firewall rule. Ports below 1024 work because
# the service has CAP_NET_BIND_SERVICE.
#
# Change the names, addresses and certificate files, then check it with
#   drlb_server --config-file=FILE --check-config
# and run it as drlb_server@NAME. The peer's config is mux_firewall_b.cfg.
# See "Port multiplexer" in the user guide.

[LBSERVER]
service_name = firewall_a
mode = MUX
mux_peer_name = drlb-a.example.com
enable_logging = 1
log_level = 1
logfile_name = /var/log/drlb/firewall_a.log
enable_stats = 1
stats_file_name = /var/log/drlb/firewall_a_stats.log
use_timeout = 1
timeout_secs = 3600

[MUXTUNNEL]
name = drlb-b
remote_host = drlb-b.example.com
remote_port = 443
tunnel_connections = 1

[MUXPORT]
channel = smtp
protocol = TCP
listen_ip_addr = 127.0.0.1
port = 25

[MUXPORT]
channel = imap
protocol = TCP
listen_ip_addr = 127.0.0.1
port = 143

[MUXPORT]
channel = ldap
protocol = TCP
listen_ip_addr = 127.0.0.1
port = 389

[MUXPORT]
channel = admin_web
protocol = TCP
listen_ip_addr = 127.0.0.1
port = 8443

[MUXPORT]
channel = snmp
protocol = UDP
listen_ip_addr = 127.0.0.1
port = 161

[MUXPORT]
channel = syslog
protocol = UDP
listen_ip_addr = 127.0.0.1
port = 514

# This server's certificate is its client certificate on the tunnel; the
# peer's certificate is checked against the CA and remote_host.
[SSLCONFIG]
ssl_key_file = /etc/drlb/ssl/private/drlb-a.key
ssl_cert_file = /etc/drlb/ssl/certs/drlb-a.crt
ssl_backend_ca_list_file = /etc/drlb/ssl/certs/tunnel_ca.crt
