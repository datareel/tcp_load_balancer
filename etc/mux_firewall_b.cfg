# DRLB 2.2 port multiplexer example: one open port in place of many firewall rules, server B
#
# Server B (cloud) accepts the tunnel on 443 and delivers the six
# services to their hosts on its private network. Its firewall and
# cloud security group need one inbound rule: 443/tcp from server A.
# If B also runs a web server on 443, use another tunnel port. firewalld:
#   firewall-cmd --permanent --new-zone=drlb-tunnel
#   firewall-cmd --permanent --zone=drlb-tunnel --add-source=<server A address>
#   firewall-cmd --permanent --zone=drlb-tunnel --add-port=443/tcp
#   firewall-cmd --reload
#
# Change the names, addresses and certificate files, then check it with
#   drlb_server --config-file=FILE --check-config
# and run it as drlb_server@NAME. The peer's config is mux_firewall_a.cfg.
# See "Port multiplexer" in the user guide.

[LBSERVER]
service_name = firewall_b
mode = MUX
mux_peer_name = drlb-b.example.com
mux_listen = 1
port = 443
mux_allowed_peers = drlb-a.example.com
enable_logging = 1
log_level = 1
logfile_name = /var/log/drlb/firewall_b.log
enable_stats = 1
stats_file_name = /var/log/drlb/firewall_b_stats.log
use_timeout = 1
timeout_secs = 3600

[MUXDEST]
channel = smtp
protocol = TCP
hostname = mail.internal.example.com
port = 25

[MUXDEST]
channel = imap
protocol = TCP
hostname = mail.internal.example.com
port = 143

[MUXDEST]
channel = ldap
protocol = TCP
hostname = ldap.internal.example.com
port = 389

[MUXDEST]
channel = admin_web
protocol = TCP
hostname = 127.0.0.1
port = 8443

[MUXDEST]
channel = snmp
protocol = UDP
hostname = monitor.internal.example.com
port = 161

[MUXDEST]
channel = syslog
protocol = UDP
hostname = 127.0.0.1
port = 514

# Peers must present a certificate signed by ssl_client_ca_list_file
[SSLCONFIG]
ssl_key_file = /etc/drlb/ssl/private/drlb-b.key
ssl_cert_file = /etc/drlb/ssl/certs/drlb-b.crt
ssl_client_ca_list_file = /etc/drlb/ssl/certs/tunnel_ca.crt
ssl_backend_ca_list_file = /etc/drlb/ssl/certs/tunnel_ca.crt
