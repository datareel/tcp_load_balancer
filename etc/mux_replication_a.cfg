# DRLB 2.2 port multiplexer example: database replication, server A
#
# Two packages, OSA and OCA, replicate their databases between server A
# (on site, for example a workstation) and server B (a cloud server).
# Server A opens the tunnel, so only outbound 2073/tcp is needed on
# site. Both replication streams share one TLS tunnel on port 2073,
# so the firewall between the sites needs only 2073/tcp. Each package
# has its own channel: a slow or stopped replica of one package does
# not hold up the other.
#
# The replication ports below (OSA 5101, OCA 5102) are placeholders:
# use the ports each package's replication client connects to. Point
# each package's replication client at 127.0.0.1 and its port here.
#
# Copy to /etc/drlb/repl_mux.cfg, change the names, addresses and
# certificate files, then check it:
#   drlb_server --config-file=/etc/drlb/repl_mux.cfg --check-config
# and run it as drlb_server@repl_mux. See mux_replication_b.cfg for
# server B and "Port multiplexer" in the user guide.

[LBSERVER]
service_name = repl_mux
mode = MUX
mux_peer_name = drlb-a.example.com
enable_logging = 1
log_level = 1
logfile_name = /var/log/drlb/repl_mux.log
enable_stats = 1
stats_file_name = /var/log/drlb/repl_mux_stats.log
# Replication connections stay open and can be idle for a long time:
# do not close idle streams.
use_timeout = 0
# A replication client that connects while the tunnel is down (after a
# restart, or during a short outage) waits up to mux_hold_secs for the
# tunnel instead of being closed.
mux_hold_secs = 30

[MUXTUNNEL]
name = drlb-b
remote_host = drlb-b.example.com
remote_port = 2073
tunnel_connections = 1

# OSA replication: the OSA client on A connects to 127.0.0.1:5101
[MUXPORT]
channel = osa_repl
protocol = TCP
listen_ip_addr = 127.0.0.1
port = 5101

# OCA replication: the OCA client on A connects to 127.0.0.1:5102
[MUXPORT]
channel = oca_repl
protocol = TCP
listen_ip_addr = 127.0.0.1
port = 5102

[SSLCONFIG]
ssl_key_file = /etc/drlb/ssl/private/drlb-a.key
ssl_cert_file = /etc/drlb/ssl/certs/drlb-a.crt
ssl_backend_ca_list_file = /etc/drlb/ssl/certs/tunnel_ca.crt
