# DRLB 2.2 port multiplexer example: database replication, server A
#
# This is the config that carries the OSA and OCA database replication
# in production (with the names, addresses and paths changed). Two
# packages, OSA and OCA, replicate their databases (DataReel gxObjRepl)
# from server A (on site, for example a workstation) to server B (a
# cloud standby). Server A opens the tunnel, so only outbound 2073/tcp
# is needed on site. Both replication streams share one TLS tunnel on
# port 2073, so the firewall between the sites needs only 2073/tcp.
# Each package has its own channel: a slow or stopped replica of one
# package does not hold up the other.
#
# Each package's replication primary on A sends to its [MUXPORT] on
# 127.0.0.1 (OSA: copy 127.0.0.1:5101, OCA: copy 127.0.0.1:5102 in its
# objrepl.conf). gxObjRepl checks the copy's certificate against the
# address it connects to, so the copy certificates need IP:127.0.0.1 in
# their subjectAltName. These are separate from the tunnel certificates.
#
# When remote_host is an IP address (as here), server B's tunnel
# certificate must have that address in its subjectAltName, or set
# ssl_hostname in [MUXTUNNEL] to a name that is in it.
#
# Copy to /etc/drlb/repl_mux.cfg, change the names, addresses and
# certificate files, then check it:
#   drlb_server --config-file=/etc/drlb/repl_mux.cfg --check-config
# and run it as drlb_server@repl_mux. See mux_replication_b.cfg for
# server B and "Port multiplexer" in the user guide.

[LBSERVER]
service_name = repl_mux
mode = MUX
mux_peer_name = drlb-a.example.com
enable_logging = 1
log_level = 1
logfile_name = /var/log/drlb/repl_mux.log
enable_stats = 1
stats_file_name = /var/log/drlb/repl_mux_stats.log
# Replication connections stay open and can be idle for a long time:
# do not close idle streams.
use_timeout = 0
# A replication client that connects while the tunnel is down (after a
# restart, or during a short outage) waits up to mux_hold_secs for the
# tunnel instead of being closed.
mux_hold_secs = 30

[MUXTUNNEL]
name = drlb-b.example.com
remote_host = 192.0.2.20
remote_port = 2073
tunnel_connections = 1

# OSA: the OSA replication primary (objrepl.conf: copy 127.0.0.1:5101)
[MUXPORT]
channel = osa_repl
protocol = TCP
listen_ip_addr = 127.0.0.1
port = 5101

# OCA: the OCA replication primary (objrepl.conf: copy 127.0.0.1:5102)
[MUXPORT]
channel = oca_repl
protocol = TCP
listen_ip_addr = 127.0.0.1
port = 5102

[SSLCONFIG]
ssl_key_file = /etc/drlb/ssl/private/drlb-a.key
ssl_cert_file = /etc/drlb/ssl/certs/drlb-a.crt
ssl_backend_ca_list_file = /etc/drlb/ssl/certs/tunnel_ca.crt
