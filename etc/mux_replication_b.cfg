# DRLB 2.2 port multiplexer example: database replication, server B
#
# This is the config that carries the OSA and OCA database replication
# in production (with the names, addresses and paths changed). Server B
# (the cloud standby) accepts the tunnel from server A on port 2073 and
# delivers each channel to its package's replication copy (DataReel
# gxObjRepl) on 127.0.0.1. Open only 2073/tcp in firewalld, for server
# A only. On a cloud server, also allow 2073/tcp from server A's public
# address only in the cloud firewall (for example the instance's
# security group).
#
# Each package's replication copy listens on 127.0.0.1 (OSA: listen
# 127.0.0.1:5101, OCA: listen 127.0.0.1:5102 in its copy config), so
# only DRLB reaches it. Server B's tunnel certificate has
# DNS:drlb-b.example.com, its public address and IP:127.0.0.1 in its
# subjectAltName; mux_allowed_peers names server A's certificate.
#
# Copy to /etc/drlb/repl_demux.cfg, change the names, addresses and
# certificate files, check it with --check-config and run it as
# drlb_server@repl_demux. See mux_replication_a.cfg for server A.

[LBSERVER]
service_name = repl_demux
mode = MUX
mux_peer_name = drlb-b.example.com
mux_listen = 1
port = 2073
mux_allowed_peers = drlb-a.example.com
enable_logging = 1
log_level = 1
logfile_name = /var/log/drlb/repl_demux.log
enable_stats = 1
stats_file_name = /var/log/drlb/repl_demux_stats.log
# Replication connections stay open and can be idle for a long time
use_timeout = 0

# OSA: the OSA replication copy (copy config: listen 127.0.0.1:5101)
[MUXDEST]
channel = osa_repl
protocol = TCP
hostname = 127.0.0.1
port = 5101

# OCA: the OCA replication copy (copy config: listen 127.0.0.1:5102)
[MUXDEST]
channel = oca_repl
protocol = TCP
hostname = 127.0.0.1
port = 5102

[SSLCONFIG]
ssl_key_file = /etc/drlb/ssl/private/drlb-b.key
ssl_cert_file = /etc/drlb/ssl/certs/drlb-b.crt
ssl_client_ca_list_file = /etc/drlb/ssl/certs/tunnel_ca.crt
ssl_backend_ca_list_file = /etc/drlb/ssl/certs/tunnel_ca.crt
