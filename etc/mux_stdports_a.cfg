# DRLB 2.2 port multiplexer example: standard port numbers for several instances of one service, server A
#
# Two PostgreSQL databases, one for OSA and one for OCA, both keep the
# standard port 5432 for their clients. On A each one listens on its
# own loopback address (Linux routes all of 127.0.0.0/8 to loopback,
# no setup needed); give them names in /etc/hosts:
#   127.0.0.2  osa-db
#   127.0.0.3  oca-db
# and clients connect to osa-db:5432 and oca-db:5432. On B the two
# instances run on one server on 5432 and 5433, or on two hosts on 5432:
# only B's config knows.
#
# Change the names, addresses and certificate files, then check it with
#   drlb_server --config-file=FILE --check-config
# and run it as drlb_server@NAME. The peer's config is mux_stdports_b.cfg.
# See "Port multiplexer" in the user guide.

[LBSERVER]
service_name = stdports_a
mode = MUX
mux_peer_name = drlb-a.example.com
enable_logging = 1
log_level = 1
logfile_name = /var/log/drlb/stdports_a.log
enable_stats = 1
stats_file_name = /var/log/drlb/stdports_a_stats.log
use_timeout = 1
timeout_secs = 3600

[MUXTUNNEL]
name = drlb-b
remote_host = drlb-b.example.com
remote_port = 9443
tunnel_connections = 1

[MUXPORT]
channel = osa_db
protocol = TCP
listen_ip_addr = 127.0.0.2
port = 5432

[MUXPORT]
channel = oca_db
protocol = TCP
listen_ip_addr = 127.0.0.3
port = 5432

# The same works for any port, for example each application's web front end on 443
[MUXPORT]
channel = osa_web
protocol = TCP
listen_ip_addr = 127.0.0.2
port = 443

[MUXPORT]
channel = oca_web
protocol = TCP
listen_ip_addr = 127.0.0.3
port = 443

# This server's certificate is its client certificate on the tunnel; the
# peer's certificate is checked against the CA and remote_host.
[SSLCONFIG]
ssl_key_file = /etc/drlb/ssl/private/drlb-a.key
ssl_cert_file = /etc/drlb/ssl/certs/drlb-a.crt
ssl_backend_ca_list_file = /etc/drlb/ssl/certs/tunnel_ca.crt
