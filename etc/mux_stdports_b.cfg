# DRLB 2.2 port multiplexer example: standard port numbers for several instances of one service, server B
#
# One cloud server runs both PostgreSQL instances (5432 and 5433) and
# both web front ends (8441 and 8442) on 127.0.0.1. Clients on A still
# use 5432 and 443 for each.
#
# Change the names, addresses and certificate files, then check it with
#   drlb_server --config-file=FILE --check-config
# and run it as drlb_server@NAME. The peer's config is mux_stdports_a.cfg.
# See "Port multiplexer" in the user guide.

[LBSERVER]
service_name = stdports_b
mode = MUX
mux_peer_name = drlb-b.example.com
mux_listen = 1
port = 9443
mux_allowed_peers = drlb-a.example.com
enable_logging = 1
log_level = 1
logfile_name = /var/log/drlb/stdports_b.log
enable_stats = 1
stats_file_name = /var/log/drlb/stdports_b_stats.log
use_timeout = 1
timeout_secs = 3600

[MUXDEST]
channel = osa_db
protocol = TCP
hostname = 127.0.0.1
port = 5432

[MUXDEST]
channel = oca_db
protocol = TCP
hostname = 127.0.0.1
port = 5433

[MUXDEST]
channel = osa_web
protocol = TCP
hostname = 127.0.0.1
port = 8441

[MUXDEST]
channel = oca_web
protocol = TCP
hostname = 127.0.0.1
port = 8442

# Peers must present a certificate signed by ssl_client_ca_list_file
[SSLCONFIG]
ssl_key_file = /etc/drlb/ssl/private/drlb-b.key
ssl_cert_file = /etc/drlb/ssl/certs/drlb-b.crt
ssl_client_ca_list_file = /etc/drlb/ssl/certs/tunnel_ca.crt
ssl_backend_ca_list_file = /etc/drlb/ssl/certs/tunnel_ca.crt
