# DRLB 2.2 port multiplexer example: virtual hosting for a service that has none, server A
#
# A message broker (MQTT, port 1883) can serve only one tenant per
# address and port. Server A is the front end with one public address
# per tenant (192.0.2.10 and 192.0.2.11 here), all on the standard port
# 1883. Each address is its own channel, and server B (cloud) runs one
# broker instance per tenant. A new tenant is an address on A, a
# [MUXPORT] here and a [MUXDEST] on B. Open 1883/tcp on A for the
# tenants' clients; only the tunnel goes to B.
#
# Change the names, addresses and certificate files, then check it with
#   drlb_server --config-file=FILE --check-config
# and run it as drlb_server@NAME. The peer's config is mux_vhost_b.cfg.
# See "Port multiplexer" in the user guide.

[LBSERVER]
service_name = vhost_a
mode = MUX
mux_peer_name = drlb-a.example.com
enable_logging = 1
log_level = 1
logfile_name = /var/log/drlb/vhost_a.log
enable_stats = 1
stats_file_name = /var/log/drlb/vhost_a_stats.log
use_timeout = 1
timeout_secs = 3600

[MUXTUNNEL]
name = drlb-b
remote_host = drlb-b.example.com
remote_port = 9443
tunnel_connections = 1

[MUXPORT]
channel = tenant_acme
protocol = TCP
listen_ip_addr = 192.0.2.10
port = 1883

[MUXPORT]
channel = tenant_globex
protocol = TCP
listen_ip_addr = 192.0.2.11
port = 1883

# This server's certificate is its client certificate on the tunnel; the
# peer's certificate is checked against the CA and remote_host.
[SSLCONFIG]
ssl_key_file = /etc/drlb/ssl/private/drlb-a.key
ssl_cert_file = /etc/drlb/ssl/certs/drlb-a.crt
ssl_backend_ca_list_file = /etc/drlb/ssl/certs/tunnel_ca.crt
