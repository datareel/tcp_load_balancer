# DRLB 2.2 port multiplexer example: virtual hosting for a service that has none, server B
#
# Server B runs a broker instance per tenant on 127.0.0.1; the larger
# tenant has two instances, load balanced. DRLB picks the instance by
# the channel, that is by the address the client connected to on A.
#
# Change the names, addresses and certificate files, then check it with
#   drlb_server --config-file=FILE --check-config
# and run it as drlb_server@NAME. The peer's config is mux_vhost_a.cfg.
# See "Port multiplexer" in the user guide.

[LBSERVER]
service_name = vhost_b
mode = MUX
mux_peer_name = drlb-b.example.com
mux_listen = 1
port = 9443
mux_allowed_peers = drlb-a.example.com
enable_logging = 1
log_level = 1
logfile_name = /var/log/drlb/vhost_b.log
enable_stats = 1
stats_file_name = /var/log/drlb/vhost_b_stats.log
use_timeout = 1
timeout_secs = 3600

[MUXDEST]
channel = tenant_acme
protocol = TCP
hostname = 127.0.0.1
port = 11883

[MUXDEST]
channel = tenant_globex
protocol = TCP
nodes = globex1, globex2
scheme = LB_RR

[LBNODE]
node_name = globex1
hostname = 127.0.0.1
port_number = 21883

[LBNODE]
node_name = globex2
hostname = 127.0.0.1
port_number = 21884

# Peers must present a certificate signed by ssl_client_ca_list_file
[SSLCONFIG]
ssl_key_file = /etc/drlb/ssl/private/drlb-b.key
ssl_cert_file = /etc/drlb/ssl/certs/drlb-b.crt
ssl_client_ca_list_file = /etc/drlb/ssl/certs/tunnel_ca.crt
ssl_backend_ca_list_file = /etc/drlb/ssl/certs/tunnel_ca.crt
